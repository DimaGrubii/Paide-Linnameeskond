name: Sync EJL Standings & Matches (OpenData API)

on:
  schedule:
    # Run every 30 minutes automatically
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual one-click trigger in GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    name: Fetch Latest EJL OpenData API Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run EJL OpenData API sync script
        env:
          EJL_API_TOKEN: ${{ secrets.EJL_API_TOKEN }}
        run: |
          python3 scripts/sync_jalgpall.py

      - name: Commit and push if standings or matches changed
        run: |
          git config user.name "Paide Linnameeskond EJL Sync Bot"
          git config user.email "actions@github.com"

          if [[ -n "$(git status --porcelain data/jalgpall-data.json)" ]]; then
            echo "Detected EJL OpenData API updates in data/jalgpall-data.json. Committing and pushing..."
            git add data/jalgpall-data.json
            git commit -m "chore(ejl): auto-sync latest EJL OpenData API standings, matches, and player stats"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in EJL data since last sync."
          fi
