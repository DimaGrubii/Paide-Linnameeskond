name: Sync EJL Standings & Matches

on:
  workflow_dispatch:
  schedule:
    # Automatically triggers Zone.ee server-side sync every day at 08:00 and 20:00 UTC (11:00 and 23:00 Estonian time)
    - cron: '0 8,20 * * *'

permissions:
  contents: write

jobs:
  sync-ejl:
    name: Trigger Zone.ee EJL Sync & Update Repo Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Trigger EJL Sync Directly on Zone.ee Server
        run: |
          python3 - << 'PYEOF'
          import json
          import ssl
          import urllib.request

          ctx = ssl._create_unverified_context()
          zone_url = "https://paidelinnameeskond.ee/sync-ejl.php?force=1"
          print(f"Triggering server-side EJL sync on Zone.ee: {zone_url}")

          try:
              req = urllib.request.Request(
                  zone_url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; PaideLinnameeskondSync/2.0; +https://paidelinnameeskond.ee)",
                      "Accept": "application/json"
                  }
              )
              raw = urllib.request.urlopen(req, context=ctx, timeout=25).read().decode("utf-8")
              data = json.loads(raw)
              teams = data.get("standings", {}).get("premiumLiiga", [])
              if isinstance(teams, list) and len(teams) >= 10:
                  with open("data/jalgpall-data.json", "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                  print(f"Successfully synced {len(teams)} Premium Liiga teams via Zone.ee!")
              else:
                  print("Warning: Zone.ee response did not contain full standings table.")
          except Exception as e:
              print(f"Notice: Zone.ee sync endpoint returned: {e}")
          PYEOF

      - name: Commit & Push if Standings Changed
        run: |
          git config user.name "Paide Linnameeskond Bot"
          git config user.email "info@paidelinnameeskond.ee"
          git add data/jalgpall-data.json
          if git diff --staged --quiet; then
            echo "No changes in EJL data."
          else
            git commit -m "chore(ejl): auto-sync official EJL standings and matches via Zone.ee"
            git push
          fi
