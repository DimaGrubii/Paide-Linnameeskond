name: Deploy to Zone.ee

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload Website to Zone.ee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Zone.ee
        env:
          ZONE_HOST: ${{ secrets.ZONE_HOST }}
          ZONE_USER: ${{ secrets.ZONE_USER }}
          ZONE_PASSWORD: ${{ secrets.ZONE_PASSWORD }}
          ZONE_SSH_KEY: ${{ secrets.ZONE_SSH_KEY }}
          ZONE_PORT: ${{ secrets.ZONE_PORT }}
          ZONE_TARGET_DIR: ${{ secrets.ZONE_TARGET_DIR }}
        run: |
          HOST="${ZONE_HOST:-paidelinnameeskond.ee}"
          USER="${ZONE_USER:-www.paidelinnameeskond.ee}"

          sudo apt-get update -y && sudo apt-get install -y lftp sshpass rsync openssh-client

          if [ -n "$ZONE_SSH_KEY" ]; then
            SSH_USER="${ZONE_USER:-virt42667}"
            PORT="${ZONE_PORT:-22}"
            TARGET_DIR="${ZONE_TARGET_DIR:-/data01/virt42667/domeenid/www.paidelinnameeskond.ee/htdocs}"
            echo "Deploying via SSH key + rsync to ${SSH_USER}@${HOST}:${TARGET_DIR}..."
            mkdir -p ~/.ssh
            echo "$ZONE_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            rsync -azP \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.gitignore' \
              --exclude='data/cache/' \
              --exclude='scripts/' \
              --exclude='README.md' \
              -e "ssh -p ${PORT} -o StrictHostKeyChecking=no" \
              ./ "${SSH_USER}@${HOST}:${TARGET_DIR}/"
          elif [ -n "$ZONE_PASSWORD" ]; then
            PORT="${ZONE_PORT:-21}"
            echo "Deploying via FTP/FTPS to ${HOST} (port ${PORT}) as ${USER}..."
            lftp -c "
              set ssl:verify-certificate no;
              set sftp:auto-confirm yes;
              set ftp:ssl-allow yes;
              set ftp:passive-mode on;
              set net:timeout 20;
              set net:max-retries 3;
              open -u \"${USER}\",\"${ZONE_PASSWORD}\" -p ${PORT} \"${HOST}\";
              cd \"${ZONE_TARGET_DIR:-htdocs}\" || cd /domeenid/www.paidelinnameeskond.ee/htdocs || cd .;
              mirror --reverse --only-newer --verbose \
                --exclude-glob .git* \
                --exclude-glob data/cache* \
                --exclude-glob scripts* \
                --exclude-glob README.md \
                ./ ./;
              bye
            "
          else
            echo "::error::Please set ZONE_PASSWORD in GitHub Repository Secrets."
            exit 1
          fi
