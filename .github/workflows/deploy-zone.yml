name: Deploy to Zone.ee

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload Website to Zone.ee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Zone.ee
        env:
          ZONE_HOST: ${{ secrets.ZONE_HOST }}
          ZONE_USER: ${{ secrets.ZONE_USER }}
          ZONE_PASSWORD: ${{ secrets.ZONE_PASSWORD }}
          ZONE_SSH_KEY: ${{ secrets.ZONE_SSH_KEY }}
          ZONE_PORT: ${{ secrets.ZONE_PORT }}
          ZONE_TARGET_DIR: ${{ secrets.ZONE_TARGET_DIR }}
        run: |
          # Clean any accidental leading/trailing spaces from secrets
          HOST=$(echo "${ZONE_HOST:-paidelinnameeskond.ee}" | xargs)
          USER=$(echo "${ZONE_USER:-www.paidelinnameeskond.ee}" | xargs)
          PORT=$(echo "${ZONE_PORT:-21}" | xargs)
          TARGET_DIR=$(echo "${ZONE_TARGET_DIR}" | xargs)

          sudo apt-get update -y && sudo apt-get install -y lftp rsync openssh-client

          if [ -n "$ZONE_SSH_KEY" ]; then
            SSH_USER="${ZONE_USER:-virt42667}"
            SSH_PORT="${ZONE_PORT:-22}"
            SSH_TARGET="${TARGET_DIR:-/data01/virt42667/domeenid/www.paidelinnameeskond.ee/htdocs}"
            echo "Deploying via SSH key + rsync to ${SSH_USER}@${HOST}:${SSH_TARGET}..."
            mkdir -p ~/.ssh
            echo "$ZONE_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            rsync -azP \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='.gitignore' \
              --exclude='data/cache/' \
              --exclude='scripts/' \
              --exclude='README.md' \
              -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no" \
              ./ "${SSH_USER}@${HOST}:${SSH_TARGET}/"
          elif [ -n "$ZONE_PASSWORD" ]; then
            echo "Deploying via FTP/FTPS to ${HOST} (port ${PORT}) as ${USER}..."
            # Write lftp script safely without expanding special characters in ZONE_PASSWORD
            cat << 'EOF' > /tmp/deploy.lftp
          set ssl:verify-certificate no
          set sftp:auto-confirm yes
          set ftp:ssl-allow yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode on
          set net:timeout 15
          set net:max-retries 2
          set net:reconnect-interval-base 5
          EOF
            # Use printf %q to safely escape username, password, and host for lftp
            ESCAPED_USER=$(printf '%q' "$USER")
            ESCAPED_PASS=$(printf '%q' "$ZONE_PASSWORD")
            if [ "$PORT" = "22" ]; then
              echo "open -u ${ESCAPED_USER},${ESCAPED_PASS} sftp://${HOST}:${PORT}" >> /tmp/deploy.lftp
            else
              echo "open -u ${ESCAPED_USER},${ESCAPED_PASS} -p ${PORT} ${HOST}" >> /tmp/deploy.lftp
            fi

            # On Zone.ee, FTP account www.paidelinnameeskond.ee already starts in htdocs (or has htdocs as a subfolder for main FTP accounts).
            # Try cd into htdocs only if it exists, without failing if we are already inside htdocs.
            cat << 'EOF' >> /tmp/deploy.lftp
          pwd
          cls -1
          cd domeenid/www.paidelinnameeskond.ee/htdocs || cd htdocs || cd .
          pwd
          mirror --reverse --only-newer --verbose --parallel=2 \
            --exclude-glob .git* \
            --exclude-glob data/cache* \
            --exclude-glob scripts* \
            --exclude-glob README.md \
            ./ ./
          bye
          EOF

            lftp -f /tmp/deploy.lftp
          else
            echo "::error::Missing ZONE_PASSWORD in GitHub Repository Secrets (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
